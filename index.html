<!doctype html>
<html lang="en" data-page-mode="review">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b5121b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rajagiri Stroke Code · Review</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./admin-reference.css">
<link rel="stylesheet" href="./shared.css">
<link rel="stylesheet" href="./kpi-workspace.css">
<link rel="stylesheet" href="./admin-review.css">
</head>
<body data-page="review">
<section class="login-screen" id="loginScreen">
<form class="login-card" id="loginForm">
<div class="brand"><div class="brand-mark">SC</div><h1>Rajagiri Stroke Code</h1></div>
<h2>Case review sign in</h2><p>Use your approved user account.</p>
<label for="loginEmail">Email address</label><input id="loginEmail" type="email" autocomplete="username" required>
<label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required>
<button class="primary-cta" id="loginSubmit" type="submit">Sign in</button>
<p id="loginError" role="alert"></p>
</form>
</section>
<div class="app-shell" id="appShell" hidden>
<header class="topbar"><div class="brand"><div class="brand-mark">SC</div><div><h1>Rajagiri Stroke Code</h1></div></div><div class="topbar-context"><strong id="viewTitle">Home</strong><span id="viewSubtitle">Shared case review</span></div><span class="tag" id="syncStatus" role="status" hidden>Connecting</span></header>
<section id="screen"></section>
<section id="reviewPanel" hidden><div class="review-breadcrumb"><button type="button" id="backToCases">Back to cases</button><span id="reviewPatient" hidden></span></div><div class="main-topbar"></div><div class="main-scroll" id="mainScroll"></div></section>
<nav class="bottom-nav" aria-label="Main navigation">
<button class="nav-btn active" data-view="home">Home</button><button class="nav-btn" data-view="cases">Cases</button><button class="nav-btn" data-view="dashboard">Dashboard</button><button class="nav-btn" data-view="kpi">KPI</button><button class="nav-btn" data-view="analysis">Analysis</button><button class="nav-btn" data-view="more">More</button>
</nav>
</div>
<script type="module" src="./admin-review.js"></script>
</body>
</html>
